<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" />
    <title>PixelForge AI</title>
    <style>
      /* Studio-matched in-window loading screen: zinc-950 + matching 48px
         draggable titlebar strip so the integrated dark window controls
         (minimize / maximize / close) sit seamlessly in the top bar from
         millisecond zero until the editor finishes booting. */
      :root { color-scheme: dark; font-family: ui-monospace, 'Geist Mono', monospace; background: #09090b; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #09090b;
        color: #f4f4f5;
        user-select: none;
        overflow: hidden;
      }
      .titlebar {
        height: 48px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0 144px;
        border-bottom: 1px solid rgba(39, 39, 42, 0.8);
        background: rgba(9, 9, 11, 0.92);
        -webkit-app-region: drag;
      }
      .titlebar-mark { width: 20px; height: 20px; display: block; flex-shrink: 0; }
      .titlebar-name {
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #f4f4f5;
      }
      .titlebar-name span { color: #2dd4bf; }
      main {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 32px;
      }
      .card { width: min(100%, 400px); text-align: center; }
      .logo { width: 64px; height: 64px; margin: 0 auto 20px; display: block; filter: drop-shadow(0 0 22px #5eead433); }
      h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
      p { margin: 8px 0 0; color: #a1a1aa; font-size: 12px; }
      .spin {
        width: 18px;
        height: 18px;
        margin: 16px auto 0;
        border: 2px solid #27272a;
        border-top-color: #2dd4bf;
        border-radius: 999px;
        animation: rot 0.9s linear infinite;
      }
      @keyframes rot { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <header class="titlebar" aria-hidden="true">
      <svg class="titlebar-mark" viewBox="0 0 20 20">
        <defs>
          <linearGradient id="tb-glow" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5eead4"/>
            <stop offset="1" stop-color="#14b8a6"/>
          </linearGradient>
        </defs>
        <rect x="0.5" y="0.5" width="19" height="19" rx="4.5" fill="#09090b"/>
        <rect x="2" y="2" width="7.5" height="7.5" rx="1.75" fill="#3f3f46"/>
        <rect x="2" y="10.5" width="7.5" height="7.5" rx="1.75" fill="#52525b"/>
        <rect x="10.5" y="2" width="7.5" height="7.5" rx="1.75" fill="#5eead4"/>
        <rect x="10.5" y="10.5" width="7.5" height="7.5" rx="1.75" fill="url(#tb-glow)"/>
      </svg>
      <span class="titlebar-name">PixelForge <span>AI</span></span>
    </header>
    <main aria-label="PixelForge AI is starting">
      <div class="card">
        <svg class="logo" viewBox="0 0 256 256" aria-hidden="true">
          <defs>
            <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#5eead4"/>
              <stop offset="1" stop-color="#0d9488"/>
            </linearGradient>
          </defs>
          <rect width="256" height="256" rx="56" fill="#09090b"/>
          <rect x="50" y="50" width="70" height="70" rx="16" fill="none" stroke="#3f3f46" stroke-width="11"/>
          <rect x="50" y="136" width="70" height="70" rx="16" fill="none" stroke="#52525b" stroke-width="11"/>
          <rect x="136" y="50" width="70" height="70" rx="16" fill="#5eead4"/>
          <rect x="136" y="136" width="70" height="70" rx="16" fill="url(#glow)"/>
        </svg>
        <h1>PixelForge AI</h1>
        <p>Preparing your pixel studio…</p>
        <div class="spin" aria-hidden="true"></div>
      </div>
    </main>
  </body>
</html>
