<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" />
    <title>Starting PixelForge AI</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #09090b; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 25%, #16343a 0, #101a1d 30%, #09090b 68%); color: #f4f4f5; }
      main { width: min(100%, 440px); padding: 32px 36px; text-align: center; }
      .mark { width: 46px; height: 46px; margin: 0 auto 18px; border: 3px solid #5eead4; border-radius: 12px; box-shadow: 0 0 28px #2dd4bf55; position: relative; }
      .mark::after { content: ''; position: absolute; inset: 10px; border: 3px solid #0f766e; border-radius: 5px; }
      h1 { margin: 0; font-size: 21px; letter-spacing: -.02em; }
      p { margin: 8px 0 0; color: #a1a1aa; font-size: 13px; }
      .bar { height: 3px; margin-top: 28px; overflow: hidden; border-radius: 999px; background: #27272a; }
      .bar::before { content: ''; display: block; width: 42%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #14b8a6, #67e8f9); animation: load 1.15s ease-in-out infinite; }
      @keyframes load { from { transform: translateX(-130%); } to { transform: translateX(335%); } }
    </style>
  </head>
  <body>
    <main aria-label="PixelForge AI is starting">
      <div class="mark" aria-hidden="true"></div>
      <h1>PixelForge AI</h1>
      <p>Preparing your pixel studio…</p>
      <div class="bar" aria-hidden="true"></div>
    </main>
  </body>
</html>
