<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- PixelForge AI — final app icon (Glow Grid, designer pick #2) -->
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="glowF" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="#09090b"/>
  <rect x="50" y="50" width="70" height="70" rx="16" fill="none" stroke="#3f3f46" stroke-width="11"/>
  <rect x="50" y="136" width="70" height="70" rx="16" fill="none" stroke="#52525b" stroke-width="11"/>
  <rect x="136" y="50" width="70" height="70" rx="16" fill="url(#glow)" filter="url(#glowF)"/>
  <rect x="136" y="136" width="70" height="70" rx="16" fill="url(#glow)"/>
</svg>
