# =============================================================================
# PixelForge AI — Automated Multi-OS Desktop Release Pipeline
#
# Pushing any version tag `v*` (e.g. `v0.5.0`) automatically:
#   1. Builds Windows (.exe + .blockmap + latest.yml),
#      macOS (.dmg + .zip + latest-mac.yml), and
#      Linux (.AppImage + latest-linux.yml) with the GitHub auto-update feed.
#   2. Publishes or updates the GitHub Release with all installers & feed files.
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build & attach (e.g. v0.5.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  BUN_VERSION: 1.3.14
  NODE_VERSION: '22'

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      DATABASE_URL: file:./prisma/release.db
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install root dependencies (bun, frozen)
        run: bun install --frozen-lockfile

      - name: Install MCP server dependencies (bun, frozen)
        working-directory: mini-services/mcp-server
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Install desktop dependencies (npm ci)
        working-directory: apps/desktop
        run: npm ci

      - name: Package desktop installer with GitHub update feed
        working-directory: apps/desktop
        run: npm run dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            apps/desktop/release/latest*.yml
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all OS release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-artifacts

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-artifacts/* --clobber
          else
            gh release create "$TAG_NAME" release-artifacts/* \
              --title "PixelForge AI $TAG_NAME" \
              --generate-notes \
              --latest
          fi
