name: Feature Request
description: Suggest a new pixel-art tool, animation feature, export format, or MCP capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What workflow or problem would this solve?
      placeholder: Explain what you're trying to make in PixelForge AI...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the feature you'd like
      placeholder: How should it work in the UI or via MCP?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Canvas / Drawing / Vectors
        - Animation / Motion Composer / VFX
        - Tilesets & Level Mockup
        - Palettes / Live FX / Skins
        - AI Co-Pilot / Second Brain / MCP
        - Import / Export (Aseprite, Godot, Unity, GIF)
        - Desktop App / Performance
    validations:
      required: false
